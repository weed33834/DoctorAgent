# ─────────────────────────────────────────────────────────────────────────────
# Release: PyPI + Docker (GHCR) + GitHub Release
# 触发: 推送 v*.*.* 格式的 git tag
# 三平台同时发布: PyPI (pip install) / Docker (ghcr.io) / GitHub Releases
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (如 0.3.1，不带 v 前缀)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Job 1: 从 pyproject.toml 提取版本号 ──
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version
        id: meta
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            # 从 git tag 提取版本号 (去掉 v 前缀)
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "📋 发布版本: $VERSION"

  # ── Job 2: 构建 Python wheel 并发布到 PyPI ──
  publish-pypi:
    name: 📦 Publish to PyPI
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/doctoragent/
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify package metadata
        run: |
          twine check dist/*
          echo "📦 构建产物:"
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # 优先使用 API Token（需在 GitHub 仓库配置 PYPI_API_TOKEN secret）
        # 若已配置 Trusted Publisher（OIDC），可注释 password 行并取消注释
        # 下方 id-token: write（已在 permissions 中启用）
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # ── Job 3: 构建 Docker 多架构镜像并发布到 GHCR ──
  publish-docker:
    name: 🐳 Publish to GHCR
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU (多架构支持)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=DoctorAgent
            org.opencontainers.image.description=Clinical AI agent for doctors
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PYTHON_VERSION=3.12

  # ── Job 4: 创建 GitHub Release ──
  publish-github:
    name: 🚀 Publish GitHub Release
    # 不依赖 PyPI（可能未配置 token），确保 Docker + Release 仍可独立发布
    needs: [prepare, publish-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read CHANGELOG for this version
        id: changelog
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            # 提取对应版本的内容
            BODY=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
            if [ -z "$BODY" ]; then
              BODY="Release v${VERSION}"
            fi
          else
            BODY="Release v${VERSION}"
          fi
          # 写入到文件以避免多行变量问题
          echo "$BODY" > /tmp/release_body.md
          echo "path=/tmp/release_body.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: DoctorAgent v${{ needs.prepare.outputs.version }}
          body_path: ${{ steps.changelog.outputs.path }}
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, 'a') || contains(needs.prepare.outputs.version, 'b') || contains(needs.prepare.outputs.version, 'rc') }}
          generate_release_notes: true
