# ─────────────────────────────────────────────────────────────────────────────
# Release: Docker (GHCR) + GitHub Release
# 触发: 推送 v*.*.* 格式的 git tag
# 双平台发布: Docker (ghcr.io) / GitHub Releases
# PyPI 发布已移除，如需自行发布请参考 RELEASE.md 中的 PyPI 可选步骤
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (如 0.3.3，不带 v 前缀)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Job 1: 从 git tag 提取版本号 ──
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version
        id: meta
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            # 从 git tag 提取版本号 (去掉 v 前缀)
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "📋 发布版本: $VERSION"

  # ── Job 2: 构建 Docker 多架构镜像并发布到 GHCR ──
  publish-docker:
    name: 🐳 Publish to GHCR
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU (多架构支持)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=DoctorAgent
            org.opencontainers.image.description=Clinical AI agent for doctors
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PYTHON_VERSION=3.12

  # ── Job 3: 创建 GitHub Release ──
  publish-github:
    name: 🚀 Publish GitHub Release
    needs: [prepare, publish-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read CHANGELOG for this version
        id: changelog
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            # 提取对应版本的内容
            BODY=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
            if [ -z "$BODY" ]; then
              BODY="Release v${VERSION}"
            fi
          else
            BODY="Release v${VERSION}"
          fi
          # 写入到文件以避免多行变量问题
          echo "$BODY" > /tmp/release_body.md
          echo "path=/tmp/release_body.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: DoctorAgent v${{ needs.prepare.outputs.version }}
          body_path: ${{ steps.changelog.outputs.path }}
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, 'a') || contains(needs.prepare.outputs.version, 'b') || contains(needs.prepare.outputs.version, 'rc') }}
          generate_release_notes: true
