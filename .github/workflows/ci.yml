name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project with dev + server extras
        run: |
          python -m pip install --upgrade pip
          # Install all extras that the test suite exercises (except kms: its
          # cloud SDKs cannot work in CI without real credentials, and the
          # kms tests are designed to verify graceful ImportError handling).
          # NOTE: `evaluation` (datasets) is intentionally excluded. When
          # installed, test_benchmark.py loads the real MedQA/PubMedQA
          # datasets from the HuggingFace hub; their `answer` field format
          # drifts across hub revisions and the hub is not reliable in CI.
          # Without `datasets` installed, load_dataset() falls back to the
          # built-in sample data and the suite is deterministic.
          # NOTE: `observability` is excluded because deepeval requires
          # click<8.4.0, conflicting with core dep click>=8.4,<9.0.
          # deepeval is a RAG evaluation library not needed in CI.
          pip install -e ".[dev,server,clinical,mcp,s3,auth]"

      - name: Lint with ruff
        run: |
          ruff check doctoragent/
          ruff format --check doctoragent/

      - name: Run tests with coverage gate
        # The 60% threshold is set in pyproject.toml ([tool.coverage.run]
        # omit + [tool.coverage.report]). The gate catches regressions in
        # the well-tested core (clinical / security / agent / API) while
        # excluding platform-specific and optional-dependency modules that
        # cannot run on every CI matrix leg (PyQt GUI, Windows-only, sync).
        run: pytest --cov=doctoragent --cov-report=xml --cov-report=term-missing --cov-fail-under=60

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

  frontend:
    name: Build Frontend (Vue 3 + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build the web console
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Verify dist was generated
        run: test -f frontend/../doctoragent/api/static/console/dist/index.html
